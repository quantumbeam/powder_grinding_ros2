# Ported from ROS1 grinding_motion_routines/config/cobotta_grinding_demo/{motion_config,planning_scene_config}.yaml
cobotta_grinding_demo:
  ros__parameters:
    # Robot and Controller Parameters
    controller_name: "arm_controller"
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    base_link: "base_link"
    grinding_ee_link: "pestle_tip"
    gathering_ee_link: "spatula_tip"
    robot_description_package: "grinding_robot_description"
    robot_description_file_path: "/urdf/cobotta/cobotta_with_pestle.urdf"
    ik_solver: "trac_ik"

    # Mortar (asone_agate_mortar_80x100x36)
    mortar_top_position: [0.25, 0.0, 0.022]
    # official infomation says 0.04 * 0.04 * 0.032 but z is more deep actually
    mortar_inner_scale: [0.04, 0.04, 0.036]
    # Height above the mortar top for the initial pose [m]
    init_pose_height: 0.05

    # Grinding Parameters (positions in mm, will be converted to meters internally)
    grinding_pos_beginning_mm: [-8.0, 0.0]
    grinding_pos_end_mm: [-8.0, 0.0001]
    grinding_center_pos_mm: [0.0, 0.0]
    grinding_rz_beginning_mm: 36.0
    grinding_rz_end_mm: 36.0
    grinding_number_of_rotation: 5.0
    grinding_angle_scale: 0.3
    grinding_yaw_bias: -1.5707963268
    grinding_number_of_waypoints_per_circle: 100
    # Peak joint velocity / URDF limit (J4 is the bottleneck): 5.0s: 15%, 1.5s: 49%, 1.0s: 73%, min 0.73s
    grinding_sec_per_rotation: 1.5
    grinding_joint_difference_limit_for_motion_planning: 0.03

    # Gathering Parameters (positions in mm, will be converted to meters internally)
    gathering_pos_beginning_mm: [-30.0, 0.0]
    gathering_pos_end_mm: [-23.0, 0.0001]
    gathering_center_pos_mm: [0.0, 0.0]
    gathering_rz_beginning_mm: 36.0
    gathering_rz_end_mm: 36.0
    gathering_number_of_rotation: 5.0
    gathering_angle_scale: 0.0
    gathering_yaw_bias: 0.0
    gathering_number_of_waypoints_per_circle: 50
    # Peak joint velocity / URDF limit (J3 is the bottleneck): 5.0s: 48%, 3.0s: 80%, min 2.4s
    gathering_sec_per_rotation: 5.0
    gathering_joint_difference_limit_for_motion_planning: 0.1

    # Switching between pestle and spatula rotates J4 by ~1.4 rad.
    # Keep it slow because of the COBOTTA joint velocity limit (J4: ~0.70 rad/s).
    ee_change_to_gathering_sec: 8.0
    ee_change_to_grinding_sec: 8.0

    max_attempts: 100

# JointTrajectoryControllerHelper used in cobotta_grinding_demo.py
cobotta_jtc_helper:
  ros__parameters:
    # "Distance" always runs until the timeout (500 waypoints x 5 ms = 2.6 s before each motion).
    # "Speed" returns the first solution (0.06 s) with the same joint continuity for the grinding path.
    trac_ik_solver_type: "Speed"
    trac_ik_timeout: 0.005
    trac_ik_epsilon: 1e-5
    # COBOTTA has low joint velocity limits (J1: ~0.38 rad/s, J6: ~1.05 rad/s),
    # so keep single pose movements slow enough even for pure re-orientation.
    default_cartesian_speed_for_pose: 0.03
    min_time_to_reach_for_pose: 3.0
