# MoveIt controllers for COBOTTA (grinding_robot_bringup/config/cobotta_controllers.yaml)
controller_names:
  - arm_controller

arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6
